name: mssql_native
description: Native Microsoft SQL Server driver for Dart and Flutter, with connection pooling, streaming queries, cancellation, transactions, stored procedures and bulk copy.
version: 0.1.1
homepage: https://github.com/Aksoyhlc/mssql_native
repository: https://github.com/Aksoyhlc/mssql_native
issue_tracker: https://github.com/Aksoyhlc/mssql_native/issues

environment:
  sdk: '>=3.10.0 <4.0.0'

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  code_assets: '>=1.2.0 <3.0.0'
  ffi: ^2.2.0
  hooks: '>=2.0.0 <3.0.0'
  meta: ^1.15.0
  native_toolchain_c: '>=0.19.1 <0.20.0'

dev_dependencies:
  lints: ^6.1.0
  test: ^1.32.0
